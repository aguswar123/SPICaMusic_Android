name: Apply animation patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          git apply --whitespace=nowarn animation-fix.patch
          git rm -q --cached animation-fix.patch
          rm animation-fix.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Match HTML lyric animation (timing, glide, wobble)"
          git push
