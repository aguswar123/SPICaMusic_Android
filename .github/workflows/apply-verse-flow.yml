name: Apply Verse Flow patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          git apply --check verse-flow.patch
          git apply verse-flow.patch

      - name: Remove patch file and commit
        run: |
          git rm -f --quiet verse-flow.patch 2>/dev/null || rm -f verse-flow.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Verse Flow player background style"
          git push
