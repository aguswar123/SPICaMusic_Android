name: Apply lyrics patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          git apply --whitespace=nowarn lyrics-settings.patch
          git rm -q --cached lyrics-settings.patch
          rm lyrics-settings.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add lyrics settings (font, size, blur, jiggle)"
          git push
