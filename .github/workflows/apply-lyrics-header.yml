name: Apply lyrics header patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          git apply --check lyrics-header.patch
          git apply lyrics-header.patch

      - name: Remove patch file and commit
        run: |
          git rm -f --quiet lyrics-header.patch 2>/dev/null || rm -f lyrics-header.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lyrics header: bigger album, like + menu buttons"
          git push
