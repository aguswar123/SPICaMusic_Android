name: Apply part 2 patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          git apply --whitespace=nowarn part2.patch
          git rm -q --cached part2.patch
          rm part2.patch
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Background vocal colour, line order, attach to words (part 2)"
          git push
